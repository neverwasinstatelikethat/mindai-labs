name: mindai-scientific-tangle

x-service-defaults: &service-defaults
  restart: unless-stopped
  networks: [mindai]

services:
  backend:
    <<: *service-defaults
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file:
      - path: .env
        required: false
    environment:
      KNOWLEDGE_BACKEND: neo4j
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_PASSWORD: ${NEO4J_RUNTIME_PASSWORD:-mindai-neo4j-local}
      ELASTICSEARCH_URL: http://elasticsearch:9200
      DATABASE_URL: postgresql://mindai:${POSTGRES_RUNTIME_PASSWORD:-mindai-postgres-local}@postgres:5432/mindai
      SOURCE_ROOT: /data/sources
      # Доступ: учётные записи в postgres (контур аналитиков), cookie Secure только
      # при APP_ENV=production, CSRF-источники — под публичным HTTPS-прокси.
      APP_ENV: ${APP_ENV:-development}
      ACCOUNTS_BACKEND: ${ACCOUNTS_BACKEND:-postgres}
      SESSION_TTL_DAYS: ${SESSION_TTL_DAYS:-14}
      TRUSTED_ORIGINS: ${TRUSTED_ORIGINS:-http://localhost:43119,http://127.0.0.1:43119,http://localhost:5173,http://localhost:46617,http://127.0.0.1:46617}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:43119}
      # LLM-контур и бюджет агентного запроса объявлены здесь явно. До этого они
      # приходили только через env_file (required: false), и запуск без .env поднимал
      # сервис с дефолтами config.py — «модель нет, бюджет другой», и видно это
      # было только по фактическим ответам. Значения совпадают с config.py.
      GIGACHAT_API_KEY: ${GIGACHAT_API_KEY:-}
      GIGACHAT_MODEL: ${GIGACHAT_MODEL:-GigaChat}
      GIGACHAT_SCOPE: ${GIGACHAT_SCOPE:-GIGACHAT_API_PERS}
      GIGACHAT_TRUSTED_ROOTS: ${GIGACHAT_TRUSTED_ROOTS:-certs/russian-trusted-root-ca.crt}
      GIGACHAT_MAX_CONCURRENT: ${GIGACHAT_MAX_CONCURRENT:-1}
      GIGACHAT_QUEUE_WAIT_SECONDS: ${GIGACHAT_QUEUE_WAIT_SECONDS:-60}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-1024}
      AGENT_DEADLINE_SECONDS: ${AGENT_DEADLINE_SECONDS:-300}
      AGENT_MAX_TOOL_ROUNDS: ${AGENT_MAX_TOOL_ROUNDS:-2}
      AGENT_MAX_REVISIONS: ${AGENT_MAX_REVISIONS:-1}
      CONTEXT_TOKEN_BUDGET: ${CONTEXT_TOKEN_BUDGET:-5120}
      AGENT_MAX_CONCURRENT_RUNS: ${AGENT_MAX_CONCURRENT_RUNS:-4}
      # Размер пула блокирующих чтений хранилища: без него to_thread берёт
      # default executor цикла, посчитанный от ядер хоста, а не от ёмкости
      # контейнера, и медленный обход графа тормозит списки находок.
      STORAGE_THREAD_POOL_SIZE: ${STORAGE_THREAD_POOL_SIZE:-16}
      LLM_CACHE_TTL_SECONDS: ${LLM_CACHE_TTL_SECONDS:-900}
      # Пусто = /metrics открыт (локальный контур); задано — Prometheus обязан
      # присылать Bearer, потому что метрики называют содержимое корпуса.
      METRICS_TOKEN: ${METRICS_TOKEN:-}
    volumes:
      - ./Источники информации:/data/sources:ro
    ports: ["127.0.0.1:${BACKEND_PORT:-46617}:8000"]
    depends_on:
      # Только те хранилища, к которым приложение действительно обращается:
      # redis кодом не используется, и ждать его здоровья на старте — значит
      # плодить отказы запуска без причины.
      neo4j: { condition: service_healthy }
      elasticsearch: { condition: service_healthy }
      postgres: { condition: service_healthy }
    healthcheck:
      # Liveness, а не readiness: без GIGACHAT_API_KEY /health/ready честно
      # отвечает 503, и на этом проверки контейнер считался бы нездоровым, а
      # frontend и prometheus (depends_on: service_healthy) не поднимались бы
      # вовсе. Готовность контура — дело человека и мониторинга, не healthcheck.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live')"]
      interval: 20s
      timeout: 5s
      retries: 8
    deploy:
      resources:
        limits: { cpus: "2.0", memory: 2G }

  preload:
    <<: *service-defaults
    profiles: [tools]
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file:
      - path: .env
        required: false
    environment:
      KNOWLEDGE_BACKEND: neo4j
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_PASSWORD: ${NEO4J_RUNTIME_PASSWORD:-mindai-neo4j-local}
      ELASTICSEARCH_URL: http://elasticsearch:9200
      SOURCE_ROOT: /data/sources
    volumes:
      - ./Источники информации:/data/sources:ro
    command: ["python", "-m", "scientific_tangle.preload"]
    restart: "no"
    depends_on:
      neo4j: { condition: service_healthy }
      elasticsearch: { condition: service_healthy }

  frontend:
    <<: *service-defaults
    build:
      context: ./frontend
    environment:
      INTERNAL_API_URL: http://backend:8000
    ports: ["127.0.0.1:${FRONTEND_PORT:-43119}:3000"]
    depends_on:
      backend: { condition: service_healthy }
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 512M }

  neo4j:
    <<: *service-defaults
    image: neo4j:5.26.8-community
    stop_grace_period: 30s
    environment:
      NEO4J_AUTH: ${NEO4J_USERNAME:-neo4j}/${NEO4J_RUNTIME_PASSWORD:-mindai-neo4j-local}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
    # loopback: Neo4j Browser читает и меняет весь корпус, поэтому доступ только
    # с хоста контейнера (межсервисный трафик идёт по bolt://neo4j, а не по этим портам).
    ports: ["127.0.0.1:47129:7474", "127.0.0.1:44917:7687"]
    volumes: ["neo4j_data:/data"]
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u ${NEO4J_USERNAME:-neo4j} -p ${NEO4J_RUNTIME_PASSWORD:-mindai-neo4j-local} 'RETURN 1' || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 10
    deploy:
      resources:
        limits: { cpus: "2.0", memory: 2G }

  elasticsearch:
    <<: *service-defaults
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.6
    stop_grace_period: 30s
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms768m -Xmx768m
    # xpack.security отключён: индекс читается без учётных данных, поэтому порт
    # опубликован только на loopback.
    ports: ["127.0.0.1:42733:9200"]
    volumes: ["elastic_data:/usr/share/elasticsearch/data"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health >/dev/null || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 10
    deploy:
      resources:
        limits: { cpus: "2.0", memory: 1536M }

  redis:
    <<: *service-defaults
    image: redis:7.4.2-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redis_data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  postgres:
    <<: *service-defaults
    image: postgres:17.5-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mindai}
      POSTGRES_USER: ${POSTGRES_USER:-mindai}
      POSTGRES_PASSWORD: ${POSTGRES_RUNTIME_PASSWORD:-mindai-postgres-local}
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mindai} -d ${POSTGRES_DB:-mindai}"]
      interval: 10s
      timeout: 5s
      retries: 10

  prometheus:
    <<: *service-defaults
    image: prom/prometheus:v3.4.1
    environment:
      # Тот же токен, что у бэкенда: Prometheus подставляет его в
      # authorization.credentials своего конфига (ops/prometheus/prometheus.yml).
      METRICS_TOKEN: ${METRICS_TOKEN:-}
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus"]
    ports: ["127.0.0.1:${PROMETHEUS_PORT:-46307}:9090"]
    volumes:
      - ./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      backend: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 10

  grafana:
    <<: *service-defaults
    image: grafana/grafana:12.0.1
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-change-me-now}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports: ["127.0.0.1:${GRAFANA_PORT:-45213}:3000"]
    volumes:
      - grafana_data:/var/lib/grafana
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      # Дашборды лежат на диске и провижонятся файлом: панель, собранная руками в
      # UI, не переживает пересоздание контейнера и не попадает в репозиторий.
      - ./ops/grafana/dashboards:/etc/grafana/dashboards:ro
    depends_on:
      prometheus: { condition: service_healthy }

networks:
  mindai:

volumes:
  neo4j_data:
  elastic_data:
  redis_data:
  postgres_data:
  prometheus_data:
  grafana_data:
