[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "scientific-tangle"
version = "0.1.0"
description = "Evidence-centric Agentic GraphRAG for mining and metallurgy R&D"
requires-python = ">=3.12"
dependencies = [
  "certifi>=2024.12.23",
  "elasticsearch>=8.17,<9",
  "fastapi>=0.115,<1",
  "gigachat>=0.1,<1",
  "httpx>=0.28,<1",
  "igraph>=0.11",
  "langgraph>=0.6,<2",
  "langgraph-checkpoint-postgres>=3,<4",
  "leidenalg>=0.10",
  "neo4j>=5.28,<7",
  "networkx>=3.4,<4",
  "openpyxl>=3.1,<4",
  "pillow>=11,<13",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "prometheus-fastapi-instrumentator>=7.1,<8",
  "psycopg[binary,pool]>=3.2,<4",
  "python-multipart>=0.0.20,<1",
  "python-docx>=1.1,<2",
  "pypdf>=5.4,<7",
  "pymupdf>=1.25,<2",
  "pytesseract>=0.3.13,<1",
  "pyshacl>=0.30,<1",
  "rdflib>=7.1,<8",
  "typing-extensions>=4.12,<5",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.14,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<2",
  "ruff>=0.9,<1",
  "types-openpyxl>=3.1,<4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/scientific_tangle"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["scientific_tangle"]

# Научные обёртки без pypa-совместимой типизации (py.typed отсутствует):
# igraph/leidenalg/networkx — резервные ветки community detection, fitz и
# pytesseract — оптическая обработка сканов. Проверка типов на них не
# распространяется, но границы вызовов типизированы в нашем коде.
[[tool.mypy.overrides]]
module = ["fitz.*", "pytesseract.*", "networkx.*", "igraph.*", "leidenalg.*"]
ignore_missing_imports = true
