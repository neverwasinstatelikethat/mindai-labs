<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#fdfcf8" />
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <!--
    ═══ DIRECTION CONTRACT · Научный Клубок · мир «Softly» ═══
    FORM: мир закреплён брифом пользователя (Softly spec: пастель, зерно, pill,
          медленные reveal) — по правилу пина руль направления не бросается.
          Прежний мир «Керновая колонка» (graphite-бумага, 1px правило, нулевой
          радиус) заменён целиком, а не доработан.
    BUILD PATH: code-led. Компиляции пиксель-в-пиксель нет; амбиция живёт в этом
          контракте — FIRST VIEWPORT и SIGNATURE ниже проверяются поведением.

    THESIS   Достоверность здесь на ощупь: тезис стоит ровно столько, сколько
             его трасса до страницы, листа или диапазона ячеек. Отказ от
             «каталожного» AI-лендинга (тёмный неон, hairline-таблицы, gradient
             text) и от его противоположности — строгого бланка.
    OWN-WORLD Тёплая бумага, пастельные поля сцены (sage, lavender, coral-mist),
             чернила stone, глобальное зерно 35% слоем над всем, радиусы 22–40px,
             control — pill, тени почти невесомые. Конкретные значения живут
             только в tokens.css — здесь они не повторяются. Onest — дисплей и
             проза, Caveat — рукописная вставка (2–3 раза на страницу),
             JetBrains Mono — числа, коды и локаторы. Статусы данных
             (согласуется / гипотеза / оспаривается / заменено) сохраняют чернила
             и не размываются.
    STORY    Аналитик понимает, что каждый тезис проверяем до локатора, видит
             честные ограничения продукта вместо показных метрик и заводит
             аккаунт, чтобы продолжить работу; доступ даёт аккаунт, а не
             переключатель.
    FIRST VIEWPORT (/)
             Полноэкранный первый экран: плавающая полупрозрачная pill-навигация
             (стекло из --surface) в 16px от края, два расфокусированных
             пастельных поля, дисплейный заголовок с одним рукописным словом и
             живой композер запроса — кольцо ауры + маскот, отправка уносит
             вопрос в рабочий лист. Ниже — текстучая строка: одно длинное
             предложение едет горизонтально вместе с прокруткой (GSAP
             ScrollTrigger).
    SIGNATURE «Бумага раскрывает трассу»: любой тезис на рабочем экране
             разворачивается в слой-листок с цитатой и локатором, не покидая
             документа. Присутствие агента — маскот-аврора (голова-сфера,
             холодный спектр cyan/violet/blue, лицо белыми линиями) и то же
             кольцо в композере: покой → слушает → думает → отвечает. Экран не
             пересказывает эксплуатацию: коды ответов, пути эндпоинтов и токены
             прав остаются в логах, пользователю — состояние задачи и одно
             действие.
    MOTION   Появление при скролле: translateY 30px → 0, opacity 0 → 1, 800ms,
             стаггер через --reveal-delay; фоновые поля дышат 6s ±10px. Слой
             микро-взаимодействий: нажатие контрола, подъём панели, скользящий
             индикатор текучей полосы, блик на действии, прорастание полос,
             бегущая строка раздела в шторке. prefers-reduced-motion — всё
             статично и полностью видно.
    FINISH   unreviewed and undocumented is unfinished; this build ends with the
             finish review, the verdict, and DESIGN.md.
    ══════════════════════════════════════════════════════════════════════════
    -->
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
